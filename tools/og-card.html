<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:#070c09;
       font-family:"Plus Jakarta Sans",sans-serif;color:#eef2f7;position:relative;display:flex}
  .glow{position:absolute;inset:-20%;background:url(/assets/img/share-render.jpg) center/cover no-repeat;
        filter:blur(70px) saturate(1.3);opacity:.55}
  .veil{position:absolute;inset:0;background:
        linear-gradient(90deg,#070c09 22%,rgba(7,12,9,.72) 52%,rgba(7,12,9,.25) 78%)}
  .inner{position:relative;display:flex;align-items:center;width:100%;padding:0 68px;gap:40px}
  .copy{flex:1;min-width:0}
  .kicker{font-family:"JetBrains Mono",monospace;font-size:19px;letter-spacing:.22em;
          text-transform:uppercase;color:#3ddc86;margin-bottom:22px}
  h1{font-size:78px;font-weight:800;letter-spacing:-.04em;line-height:.98}
  h1 .sub{font-weight:500;color:#b3becb}
  p{margin-top:20px;font-size:27px;line-height:1.35;color:#cfd8e3;max-width:20ch}
  .rule{width:64px;height:4px;background:#18c46a;border-radius:4px;margin-top:28px}
  .meta{margin-top:26px;font-family:"JetBrains Mono",monospace;font-size:17px;letter-spacing:.12em;
        text-transform:uppercase;color:#8b97a5}
  .mark{width:470px;height:470px;flex:none;background:url(/assets/img/share-render.jpg) center/contain no-repeat;
        -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 52%,rgba(0,0,0,.35) 66%,transparent 74%);
        mask-image:radial-gradient(circle at 50% 50%,#000 52%,rgba(0,0,0,.35) 66%,transparent 74%)}
</style></head><body>
<div class="glow"></div><div class="veil"></div>
<div class="inner">
  <div class="copy">
    <div class="kicker">Sialkot, Pakistan</div>
    <h1>NTF <span class="sub">Sportswear</span></h1>
    <p>Custom martial arts, MMA &amp; fitness apparel</p>
    <div class="rule"></div>
    <div class="meta">MOQ from 5 pcs &middot; Shipped worldwide</div>
  </div>
  <div class="mark"></div>
</div>
</body></html>
